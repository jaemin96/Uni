  <title style="fill:rgb(0, 0, 0);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">web cleaner 동작 흐름</title>
  <desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">URL 접속 후 폴더를 선택하면 브라우저가 재귀 스캔으로 빌드 산출물을 찾아 목록을 보여주고, 사용자가 고른 항목만 삭제한 뒤 결과를 표시하고 로그를 남기는 흐름. 폴더 선택부터 삭제·로깅까지 모두 브라우저(로컬 PC)에서 실행되며 Vercel은 정적 호스팅만 담당한다.</desc>
